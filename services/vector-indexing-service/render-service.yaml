# Render Blueprint fragment (merged into the root render.yaml in Phase 9).
services:
  - type: web
    name: cleandocs-vector-indexing-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/vector-indexing-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - { key: AWS_REGION, value: eu-west-1 }
      - { key: S3_BUCKET, sync: false }
      - { key: DYNAMODB_REGISTRY_TABLE, value: cleandocs-registry }
      - { key: DYNAMODB_INGEST_TRAIL_TABLE, value: document-ingest-trail }
      - { key: AWS_ACCESS_KEY_ID, sync: false }
      - { key: AWS_SECRET_ACCESS_KEY, sync: false }
      - { key: SERVICE_AUTH_SECRET, sync: false }
      - { key: BEDROCK_KNOWLEDGE_BASE_ID, value: NEYHRDRGOT }
      - { key: BEDROCK_DATA_SOURCE_ID, value: FWC2ZGVLIT }
